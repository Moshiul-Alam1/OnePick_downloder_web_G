<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnePick Downloader - Universal Web Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: #27272a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .search-box {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .search-box input {
            flex: 1;
            background: #09090b;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px 18px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .search-box button {
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 0 24px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background: var(--accent-hover);
        }

        .loader {
            display: none;
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
        }

        .result-card {
            display: none;
            background: #09090b;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .media-info {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .media-info img {
            width: 180px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .media-details h3 {
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .media-details p {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .download-options {
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .download-options h4 {
            font-size: 0.9rem;
            margin-bottom: 12px;
            color: var(--text-muted);
        }

        .format-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .format-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .format-btn:hover {
            border-color: var(--accent-color);
            background: #1e1e24;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>OnePick Downloader</h1>
        <p>Download video and audio from 1000+ supported platforms</p>
    </div>

    <div class="search-box">
        <input type="text" id="urlInput" placeholder="Paste link here (YouTube, Facebook, Instagram, TikTok, etc.)...">
        <button onclick="fetchMedia()">Fetch</button>
    </div>

    <div class="loader" id="loader">
        <p>Fetching content details, please wait...</p>
    </div>

    <div class="result-card" id="resultCard">
        <div class="media-info">
            <img id="thumb" src="" alt="Thumbnail">
            <div class="media-details">
                <h3 id="title">Media Title</h3>
                <p id="meta">Source | Uploader</p>
            </div>
        </div>

        <div class="download-options">
            <h4>Available Formats</h4>
            <div class="format-list" id="formatList"></div>
        </div>
    </div>
</div>

<script>
    const API_BASE = "https://onepick-downloder-web-g.onrender.com";

    async function fetchMedia() {
        const url = document.getElementById('urlInput').value.trim();
        if(!url) return alert('Please enter a valid URL!');

        const loader = document.getElementById('loader');
        const resultCard = document.getElementById('resultCard');

        loader.style.display = 'block';
        resultCard.style.display = 'none';

        try {
            const response = await fetch(`${API_BASE}/api/fetch`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });

            const data = await response.json();
            loader.style.display = 'none';

            if(response.ok && data.success) {
                document.getElementById('thumb').src = data.thumbnail || 'https://via.placeholder.com/180x100?text=No+Thumbnail';
                document.getElementById('title').innerText = data.title;
                document.getElementById('meta').innerText = `${data.site} • ${data.uploader}`;

                const formatList = document.getElementById('formatList');
                formatList.innerHTML = '';

                if(data.formats && data.formats.length > 0) {
                    // Unique link filtering
                    const seen = new Set();
                    data.formats.forEach(f => {
                        const key = `${f.resolution}-${f.ext}`;
                        if(!seen.has(key) && f.url) {
                            seen.add(key);
                            const a = document.createElement('a');
                            a.className = 'format-btn';
                            a.href = f.url;
                            a.target = '_blank';
                            a.setAttribute('download', '');
                            a.innerHTML = `<span><strong>${f.resolution}</strong> (${f.ext.toUpperCase()})</span> <span>⬇️</span>`;
                            formatList.appendChild(a);
                        }
                    });
                } else {
                    formatList.innerHTML = '<p style="color:var(--text-muted)">No direct streams found.</p>';
                }

                resultCard.style.display = 'block';
            } else {
                alert('Error: ' + (data.detail || 'Could not process media link.'));
            }
        } catch (err) {
            loader.style.display = 'none';
            alert('Failed to connect to backend server. Render instance may take 30s to wake up..');
        }
    }
</script>

</body>
</html>
